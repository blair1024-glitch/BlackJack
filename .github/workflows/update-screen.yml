name: 更新觀察名單

on:
  schedule:
    # 台灣時間每個交易日 15:30（UTC 07:30），收盤後
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      probe:
        description: "只探測端點通不通，不寫入資料檔"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-screen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安裝相依套件
        run: pip install -r scripts/requirements.txt

      # 離線測試：不連網，只驗證解析與篩選邏輯。壞掉就不要去覆蓋資料檔。
      - name: 篩選邏輯測試
        run: python3 scripts/test_screen.py

      - name: 探測端點
        if: inputs.probe
        run: python3 scripts/fetch_screen.py --probe

      - name: 抓取並產生觀察名單
        if: ${{ !inputs.probe }}
        run: python3 scripts/fetch_screen.py

      - name: Commit
        if: ${{ !inputs.probe }}
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "資料沒有變動，不 commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: 更新觀察名單（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')）"
          git push
